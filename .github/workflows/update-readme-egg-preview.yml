name: Update README Dragon Egg Preview

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/update-readme-egg-preview.yml"

permissions:
  contents: write

jobs:
  update-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Replace README card cache reference
        run: |
          python3 - <<'PY'
          from pathlib import Path
          version = 'dragon-egg-real-screen-20260505'
          for file_name in ('README.md', 'README.lt.md'):
              path = Path(file_name)
              text = path.read_text()
              text = text.replace('./assets/dragon-egg-window.svg?v=real-dragon-egg-20260505', './assets/dragon-egg-window.svg')
              text = text.replace('./assets/dragon-egg-window.svg?v=dragon-egg-real-screen-20260505', './assets/dragon-egg-window.svg')
              text = text.replace('./assets/dragon-egg-window.svg', f'./assets/dragon-egg-window.svg?v={version}')
              path.write_text(text)
          PY

      - name: Commit README card refresh
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add README.md README.lt.md
          if git diff --cached --quiet; then
            echo "README card references already refreshed."
          else
            git commit -m "Refresh README Dragon Egg card references"
            git push
          fi
