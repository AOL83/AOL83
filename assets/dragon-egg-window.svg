<svg width="1000" height="1414" viewBox="0 0 1000 1414" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="1414" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050510"/><stop offset=".45" stop-color="#080615"/><stop offset="1" stop-color="#030812"/>
    </linearGradient>
    <linearGradient id="frame" x1="30" y1="20" x2="970" y2="1394" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff305f"/><stop offset=".28" stop-color="#ff2bd6"/><stop offset=".52" stop-color="#ffe600"/><stop offset=".74" stop-color="#00f5ff"/><stop offset="1" stop-color="#7cff00"/>
    </linearGradient>
    <linearGradient id="title" x1="120" y1="170" x2="880" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff164f"/><stop offset=".38" stop-color="#ff2bd6"/><stop offset=".7" stop-color="#8b5cff"/><stop offset="1" stop-color="#208cff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .label{font-family:Arial,Helvetica,sans-serif;font-weight:900;letter-spacing:7px;fill:#eaff38}
      .small{font-family:Arial,Helvetica,sans-serif;font-weight:900;letter-spacing:4px;fill:#dffbff}
      .side{font-family:Arial,Helvetica,sans-serif;font-size:18px;letter-spacing:5px;fill:#dffbff}
      .btnText{font-family:Arial,Helvetica,sans-serif;font-weight:900;font-size:24px;letter-spacing:3px;fill:#f4fbff}
      .pulse{animation:p 2.6s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
      @keyframes p{0%,100%{opacity:.55;transform:scale(.96)}50%{opacity:1;transform:scale(1.04)}}
    </style>
  </defs>
  <rect width="1000" height="1414" rx="30" fill="url(#bg)"/>
  <rect x="14" y="14" width="972" height="1386" rx="30" stroke="url(#frame)" stroke-width="8"/>
  <rect x="42" y="42" width="916" height="1330" rx="24" stroke="rgba(255,255,255,.18)" stroke-width="2"/>
  <text x="95" y="120" class="small" font-size="28" fill="#ff305f">2026</text>
  <text x="905" y="120" class="small" font-size="28" text-anchor="end" fill="#208cff">2026</text>
  <path d="M285 36H715C752 36 782 66 782 103C782 140 752 170 715 170H285C248 170 218 140 218 103C218 66 248 36 285 36Z" fill="#080a12" stroke="#eaff38" stroke-opacity=".35" stroke-width="3"/>
  <text x="500" y="96" text-anchor="middle" class="label" font-size="58">TERENCE OS</text>
  <text x="500" y="132" text-anchor="middle" class="small" font-size="22">OPERATING SYSTEMS</text>
  <text x="500" y="315" text-anchor="middle" style="font-family:Impact,Arial Black,Arial,sans-serif;font-size:112px;font-weight:900;letter-spacing:2px;fill:url(#title)" filter="url(#glow)">DRAGON EGG</text>
  <text x="500" y="384" text-anchor="middle" class="label" font-size="38">CHARACTER</text>

  <text transform="translate(78 520) rotate(90)" class="side">README // VIRTUAL // EMULATOR</text>
  <text transform="translate(933 520) rotate(90)" class="side">CLICK // EGG // LOAD // ALEH</text>

  <path d="M118 420H882L928 466V1032L882 1078H118L72 1032V466L118 420Z" fill="rgba(255,255,255,.05)" stroke="url(#frame)" stroke-width="5"/>
  <rect x="110" y="455" width="780" height="560" rx="28" fill="#071018" stroke="#36e9ff" stroke-opacity=".45" stroke-width="2"/>
  <ellipse cx="500" cy="745" rx="330" ry="255" fill="#00f5ff" opacity=".08"/>
  <ellipse class="pulse" cx="500" cy="745" rx="260" ry="260" fill="none" stroke="#00f5ff" stroke-width="3" opacity=".45"/>
  <ellipse class="pulse" cx="500" cy="745" rx="205" ry="205" fill="none" stroke="#ff2bd6" stroke-width="3" opacity=".45"/>

  <image href="data:image/jpeg;base64," x="257" y="445" width="486" height="600" preserveAspectRatio="xMidYMid meet"/>
  <rect x="190" y="900" width="620" height="86" rx="18" fill="rgba(0,0,0,.64)" stroke="#00f5ff" stroke-opacity=".46" stroke-width="2"/>
  <text x="500" y="943" text-anchor="middle" class="btnText" filter="url(#glow)">CLICK THE EGG</text>
  <text x="500" y="974" text-anchor="middle" class="small" font-size="14" fill="#9feaff">LOAD AURORA LOGISTICAL ECO HOLDINGS GATE</text>

  <text x="500" y="1148" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:54px;font-weight:950;letter-spacing:4px;fill:#fff" filter="url(#glow)">COMING SOON TO</text>
  <text x="500" y="1212" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:54px;font-weight:950;letter-spacing:4px;fill:#fff" filter="url(#glow)">BLOCKCHAIN</text>

  <path d="M120 1270H810L846 1306V1342L810 1378H120L84 1342V1306L120 1270Z" fill="#090A11" stroke="#ff2bd6" stroke-width="4"/>
  <text x="155" y="1331" class="btnText">ALEH GATE</text>
  <rect x="650" y="1291" width="160" height="66" rx="10" fill="#0D0E13" stroke="#ff2bd6" stroke-width="3"/>
  <text x="730" y="1334" text-anchor="middle" class="btnText">OPEN</text>
</svg>
