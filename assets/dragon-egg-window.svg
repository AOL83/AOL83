  <text x="500" y="1020" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:54px;font-weight:950;letter-spacing:4px;fill:#fff" filter="url(#glow)">BLOCKCHAIN</text>
  <path d="M120 1164H810L846 1200V1236L810 1272H120L84 1236V1200L120 1164Z" fill="#090A11" stroke="#FF2BD6" stroke-width="4"/>
  <text x="155" y="1224" class="button">ALEH GATE</text><rect x="650" y="1185" width="160" height="66" rx="10" fill="#0D0E13" stroke="#FF2BD6" stroke-width="3"/><text x="730" y="1227" text-anchor="middle" class="button">OPEN</text>
  <rect x="130" y="1330" width="740" height="38" rx="12" fill="#05070D" stroke="url(#frame)" stroke-width="2"/><text x="500" y="1355" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:800;letter-spacing:4px;fill:#00f5ff">SEE THE EGG. CLICK THE EGG. LOAD THE GATE.</text>
</svg>