  <text x="500" y="380" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-weight:900;letter-spacing:12px;fill:#eaff38;font-size:38px">CHARACTER</text>
  <text transform="translate(78 540) rotate(90)" class="side">README // VIRTUAL // EMULATOR</text><text transform="translate(933 540) rotate(90)" class="side">CLICK // EGG // LOAD // ALEH</text>
  <path d="M130 420H870L925 475V850L870 905H205L75 775V475L130 420Z" fill="rgba(255,255,255,.025)" stroke="url(#frame)" stroke-width="5"/>
