<svg width="1000" height="1414" viewBox="0 0 1000 1414" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGlow" x1="0" y1="0" x2="1000" y2="1414" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A0312"/>
      <stop offset="0.35" stop-color="#090615"/>
      <stop offset="0.7" stop-color="#040816"/>
      <stop offset="1" stop-color="#0B0B0E"/>
    </linearGradient>

    <linearGradient id="frameGrad" x1="30" y1="30" x2="970" y2="1384" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF2B6E"/>
      <stop offset="0.24" stop-color="#FF2BD6"/>
      <stop offset="0.50" stop-color="#FFE600"/>
      <stop offset="0.72" stop-color="#00F5FF"/>
      <stop offset="1" stop-color="#7CFF00"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="190" y1="130" x2="820" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF315D"/>
      <stop offset="0.28" stop-color="#FF2BD6"/>
      <stop offset="0.60" stop-color="#8B5CFF"/>
      <stop offset="1" stop-color="#00D9FF"/>
    </linearGradient>

    <linearGradient id="subGrad" x1="320" y1="0" x2="700" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE600"/>
      <stop offset="1" stop-color="#A8FF00"/>
    </linearGradient>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="bigGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .small {
        font-family: 'Arial', 'Helvetica', sans-serif;
        font-size: 18px;
        letter-spacing: 4px;
        fill: #d9f7ff;
      }
      .micro {
        font-family: 'Arial', 'Helvetica', sans-serif;
        font-size: 14px;
        letter-spacing: 3px;
        fill: #9beeff;
      }
      .label {
        font-family: 'Arial', 'Helvetica', sans-serif;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 2px;
        fill: white;
      }
      .value {
        font-family: 'Arial', 'Helvetica', sans-serif;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 2px;
        fill: #dffcff;
      }
      .tiny {
        font-family: 'Arial', 'Helvetica', sans-serif;
        font-size: 12px;
        letter-spacing: 2px;
        fill: #b7faff;
      }
      .windowText {
        font-family: 'Arial', 'Helvetica', sans-serif;
        font-size: 38px;
        font-weight: 700;
        letter-spacing: 4px;
        fill: #e8fbff;
      }
      .windowSub {
        font-family: 'Arial', 'Helvetica', sans-serif;
        font-size: 16px;
        letter-spacing: 3px;
        fill: #9feaff;
      }
      .barLabel {
        font-family: 'Arial', 'Helvetica', sans-serif;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 2px;
        fill: #f5fbff;
      }
    </style>
  </defs>

  <rect x="0" y="0" width="1000" height="1414" rx="28" fill="url(#bgGlow)"/>

  <rect x="12" y="12" width="976" height="1390" rx="28" stroke="url(#frameGrad)" stroke-width="8" opacity="0.9"/>
  <rect x="24" y="24" width="952" height="1366" rx="24" stroke="rgba(255,255,255,0.22)" stroke-width="2"/>

  <circle cx="90" cy="90" r="34" fill="#ff2b6e" opacity="0.28" filter="url(#bigGlow)"/>
  <circle cx="920" cy="104" r="34" fill="#a8ff00" opacity="0.24" filter="url(#bigGlow)"/>
  <circle cx="900" cy="1310" r="32" fill="#00f5ff" opacity="0.18" filter="url(#bigGlow)"/>

  <path d="M318 36H691L730 74V150L691 186H318L279 150V74L318 36Z" fill="#0a0d12" stroke="url(#frameGrad)" stroke-width="4"/>
  <text x="500" y="92" text-anchor="middle" style="font-family: Arial, Helvetica, sans-serif; font-size: 28px; font-weight: 700; letter-spacing: 3px; fill: #FFE600;">
    AURORA ENTRY
  </text>
  <text x="500" y="132" text-anchor="middle" style="font-family: Arial, Helvetica, sans-serif; font-size: 20px; font-weight: 700; letter-spacing: 5px; fill: #DDFDFF;">
