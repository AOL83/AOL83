  <text transform="translate(62 268) rotate(90)" class="small" fill="#FF2BD6">AURORA // SYSTEM // GATE</text>
  <text transform="translate(950 280) rotate(90)" class="small" fill="#A8FF00">DISPLAY // ENTRY // README</text>

  <text x="500" y="285" text-anchor="middle"
        style="font-family: Impact, Arial Black, Arial, sans-serif; font-size: 96px; font-weight: 900; letter-spacing: 2px; fill: url(#titleGrad);"
