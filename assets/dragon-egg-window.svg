<svg width="1000" height="1414" viewBox="0 0 1000 1414" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="1414"><stop stop-color="#050510"/><stop offset=".5" stop-color="#080615"/><stop offset="1" stop-color="#030812"/></linearGradient>
    <linearGradient id="frame" x1="50" y1="40" x2="950" y2="1360"><stop stop-color="#ff305f"/><stop offset=".25" stop-color="#ff2bd6"/><stop offset=".5" stop-color="#ffe600"/><stop offset=".75" stop-color="#00f5ff"/><stop offset="1" stop-color="#7cff00"/></linearGradient>
    <linearGradient id="title" x1="120" y1="190" x2="880" y2="330"><stop stop-color="#ff164f"/><stop offset=".4" stop-color="#ff2bd6"/><stop offset=".7" stop-color="#8b5cff"/><stop offset="1" stop-color="#208cff"/></linearGradient>
    <radialGradient id="screenGlow" cx="50%" cy="50%" r="60%"><stop stop-color="#00f5ff" stop-opacity=".22"/><stop offset=".55" stop-color="#ff2bd6" stop-opacity=".08"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="tv"><path d="M130 420H870L925 475V850L870 905H205L75 775V475L130 420Z"/></clipPath>
    <clipPath id="eggClip"><ellipse cx="500" cy="660" rx="245" ry="285"/></clipPath>
    <style>
