      .side{font-family:Arial,Helvetica,sans-serif;font-size:18px;letter-spacing:5px;fill:#dffbff}
      .button{font-family:Arial,Helvetica,sans-serif;font-size:26px;font-weight:900;letter-spacing:3px;fill:#f4fbff}
      .ring{transform-origin:center;transform-box:fill-box;animation:pulse 3s ease-in-out infinite}.scan{animation:scan 4.4s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.32;transform:scale(.96)}50%{opacity:.95;transform:scale(1.06)}}@keyframes scan{0%{transform:translateY(-280px);opacity:0}25%{opacity:.45}100%{transform:translateY(300px);opacity:0}}
    </style>
  </defs>
  <rect width="1000" height="1414" rx="30" fill="url(#bg)"/>
  <rect x="14" y="14" width="972" height="1386" rx="30" stroke="url(#frame)" stroke-width="8"/>
  <rect x="42" y="42" width="916" height="1330" rx="24" stroke="rgba(255,255,255,.18)" stroke-width="2"/>
  <text x="95" y="120" class="small" font-size="28" fill="#ff305f">2026</text><text x="905" y="120" class="small" font-size="28" text-anchor="end" fill="#208cff">2026</text>
  <path d="M285 36H715C752 36 782 66 782 103C782 140 752 170 715 170H285C248 170 218 140 218 103C218 66 248 36 285 36Z" fill="#080a12" stroke="#eaff38" stroke-opacity=".35" stroke-width="3"/>
  <text x="500" y="96" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-weight:900;letter-spacing:7px;fill:#eaff38;font-size:58px">TERENCE OS</text>
  <text x="500" y="132" text-anchor="middle" class="small" font-size="22">OPERATING SYSTEMS</text>
