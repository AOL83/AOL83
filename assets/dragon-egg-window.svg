  <rect x="650" y="1185" width="160" height="66" rx="10" fill="#0D0E13" stroke="#FF2BD6" stroke-width="3"/>
  <rect x="658" y="1193" width="126" height="50" rx="7" fill="#FF2BD6" fill-opacity="0.35"/>
  <text x="730" y="1227" text-anchor="middle" class="value">90</text>

  <rect x="130" y="1330" width="740" height="38" rx="12" fill="#05070D" stroke="url(#frameGrad)" stroke-width="2"/>
  <text x="500" y="1355" text-anchor="middle" style="font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 4px; fill: url(#frameGrad);">
