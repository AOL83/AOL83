    <ellipse class="ring" cx="500" cy="665" rx="205" ry="205" fill="none" stroke="#ff2bd6" stroke-width="3" opacity=".45"/>
    <g clip-path="url(#eggClip)">
      <g>
        <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 500 680" to="360 500 680" dur="3.8s" repeatCount="indefinite"/>
        <image href="https://raw.githubusercontent.com/AOL83/AOL83/main/assets/readme-real-dragon-egg.jpg?v=spin-20260505" x="195" y="405" width="610" height="600" preserveAspectRatio="xMidYMid meet"/>
      </g>
    </g>
    <rect class="scan" x="140" y="470" width="720" height="44" fill="#00f5ff" opacity=".18"/>
    <rect x="170" y="705" width="660" height="90" rx="18" fill="rgba(0,0,0,.66)" stroke="#00f5ff" stroke-opacity=".46" stroke-width="2"/>
    <text x="500" y="748" text-anchor="middle" class="button" filter="url(#glow)">CLICK THE EGG</text>
    <text x="500" y="778" text-anchor="middle" class="small" font-size="14" fill="#9feaff">LOAD AURORA LOGISTICAL ECO HOLDINGS GATE</text>
